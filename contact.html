<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SenCom - Contact</title>
  <link rel="stylesheet" href="style.css">

<body>

 
  <header>
    <div class="logo">SenCom</div>
    <nav>
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="produits.html">Produits</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  
  <section class="contact container">
    <h2>Contactez-nous</h2>
    <form>
      <label for="nom">Nom</label>
      <input type="text" id="nom" name="nom" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="tel">Téléphone</label>
      <input type="tel" id="tel" name="tel">

      <label for="msg">Message</label>
      <textarea id="msg" name="msg" required></textarea>

      <button type="submit" class="btn-senegal">Envoyer</button>
    </form>

    <p>
      📞 <a href="tel:+221771234567" class="btn-senegal">Appeler le commerce</a>
    </p>
  </section>


  <footer>
    <p>📍 Adresse : Dakar, Sénégal</p>
    <p>📞 Téléphone : +221 77 123 45 67</p>
    <p>🌐 Suivez-nous : 
      <a href="#">Facebook</a> | 
      <a href="#">Instagram</a> | 
      <a href="#">WhatsApp</a>
    </p>
    <p>&copy; 2025 SenCom - Tous droits réservés</p>
  </footer>

</body>
</html>
